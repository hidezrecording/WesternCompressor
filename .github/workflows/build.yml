# Builds Western Compressor on every push and uploads downloadable plugins.
#
# Mirrors the DN1000 pipeline: Actions tab -> pick a run -> download
# the WesternCompressor-macOS / WesternCompressor-Installer-macOS
# artifacts (VST3/AU/pkg).
#
# NOTE: macOS run is the deliverable (Nathan's Mac).
# (Renamed from Hotdog on 2026-10-14; this pipeline shipped Hotdog
# 1.0.0 the same day.)

name: Build Western Compressor

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  macos:
    name: macOS (VST3 + AU, Apple Silicon + Intel)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Download JUCE 8.0.6
        run: |
          curl -L https://github.com/juce-framework/JUCE/archive/refs/tags/8.0.6.zip -o juce.zip
          unzip -q juce.zip
          mv JUCE-8.0.6 /tmp/juce-8.0.6

      - name: Configure
        env:
          JUCE_DIR: /tmp/juce-8.0.6
        run: cmake -B build -G Xcode -DCMAKE_BUILD_TYPE=Release
                 -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
                 -S juce

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Build installer PKG
        run: |
          PKGROOT=pkgroot
          mkdir -p "$PKGROOT/Library/Audio/Plug-Ins/VST3"
          mkdir -p "$PKGROOT/Library/Audio/Plug-Ins/Components"
          mkdir -p "$PKGROOT/Applications"
          cp -R "build/OSC72_artefacts/Release/VST3/Western Compressor.vst3" "$PKGROOT/Library/Audio/Plug-Ins/VST3/"
          cp -R "build/OSC72_artefacts/Release/AU/Western Compressor.component" "$PKGROOT/Library/Audio/Plug-Ins/Components/"
          if [ -d "build/OSC72_artefacts/Release/Standalone/Western Compressor.app" ]; then
            cp -R "build/OSC72_artefacts/Release/Standalone/Western Compressor.app" "$PKGROOT/Applications/"
          fi
          pkgbuild --analyze --root "$PKGROOT" components.plist
          # Suppress bundle relocation. pkgbuild's default analysis
          # marks bundles relocatable (BundleIsRelocatable), which
          # compiles into a <relocate> entry in PackageInfo: the
          # Installer then 'upgrades' any pre-existing copy of the
          # bundle it finds ANYWHERE on disk (any mounted volume)
          # instead of writing to the PKGROOT paths above. All three
          # of our bundles share ONE bundle id
          # (com.Sabatino Audio.OSC72), so a single stray copy
          # captured all three while the preinstall wiped the
          # /Library copies first — successful installs left no
          # component in /Library at all (the 1.1.x Luna
          # disappearance saga; docs/luna-missing-diagnosis.md).
          # Force BundleIsRelocatable=false on every bundle and
          # build with the component plist.
          i=0
          while /usr/libexec/PlistBuddy -c "Print :$i" components.plist >/dev/null 2>&1; do
            /usr/libexec/PlistBuddy -c "Set :$i:BundleIsRelocatable false" components.plist 2>/dev/null || \
              /usr/libexec/PlistBuddy -c "Add :$i:BundleIsRelocatable bool false" components.plist
            i=$((i + 1))
          done
          echo "BundleIsRelocatable forced false on $i bundle(s)"
          cat components.plist
          pkgbuild --root "$PKGROOT" \
            --component-plist components.plist \
            --identifier com.sabatinoaudio.westerncompressor \
            --version 1.1.8 \
            --install-location / \
            --scripts pkg_scripts \
            WesternCompressor-1.1.8-macOS.pkg

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: WesternCompressor-macOS-${{ github.run_number }}
          path: build/OSC72_artefacts/Release/

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: WesternCompressor-Installer-macOS-${{ github.run_number }}
          path: WesternCompressor-1.1.8-macOS.pkg
