# Attaches a built installer PKG to an existing GitHub Release.
#
# Manual dispatch: give it the Build Western Compressor run ID whose
# installer artifact you want, the artifact name from that run, and
# the release tag. The upload happens entirely inside GitHub
# (GITHUB_TOKEN), so no local credentials are involved.

name: Release Western Compressor

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build Western Compressor run ID to take the installer artifact from"
        required: true
      artifact:
        description: "Installer artifact name from that run"
        required: true
        default: "WesternCompressor-Installer-macOS-1"
      tag:
        description: "Release tag to upload the installer to"
        required: true
        default: "v1.1.0"

jobs:
  release:
    name: Upload installer to release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" WesternCompressor-1.1.0-macOS.pkg
             --clobber --repo "${{ github.repository }}"
